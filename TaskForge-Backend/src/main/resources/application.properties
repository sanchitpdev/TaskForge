jwt.secret=dGhpcyBpcyBhIHNlY3VyZSBiYXNlNjQtZW5jb2RlsCBrZXkgZm9yIHRhc2tmb3JnZQ==
jwt.expiration-ms=86400000
jwt.issuer=taskforge-api
